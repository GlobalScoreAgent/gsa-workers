name: Ethos enrich

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ethos-enrich
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: workers/ethos_enrich
        run: uv sync

      - name: Run ethos enrich
        working-directory: workers/ethos_enrich
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MAX_RUNTIME_SECONDS: 19800
          CONCURRENCY: 3
          CLAIM_BATCH_SIZE: 10
          CLAIM_STALE_SECONDS: 7200
          SCORE_BATCH_SIZE: 50
          SCORE_TTL_DAYS: 15
          SCORE_THROTTLE_MS: 200
          WORKER_ID: enrich-a
        run: uv run python job.py
