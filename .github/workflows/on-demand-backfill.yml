name: On-demand backfill

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: on-demand-backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: workers/on_demand_backfill
        run: uv sync

      - name: Run on-demand backfill
        working-directory: workers/on_demand_backfill
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MAX_RUNTIME_SECONDS: 19800
          WORKER_ID: backfill-a
          ETHOS_CONCURRENCY: 3
          ETHOS_CLAIM_BATCH_SIZE: 10
          ETHOS_CLAIM_STALE_SECONDS: 7200
          SCORE_BATCH_SIZE: 50
          SCORE_TTL_DAYS: 15
          SCORE_THROTTLE_MS: 200
          ERC8183_CLAIM_BATCH_SIZE: 100
          ERC8183_CLAIM_STALE_SECONDS: 7200
          ERC8183_CONCURRENCY: 5
        run: uv run python job.py
